[package]
name = "nxformat-ffi"
version = "1.0.2"
edition = "2021"
license = "MIT"
rust-version = "1.80"
description = "C API of the nxconvert commands, for emulators and other frontends"
publish = false
build = "build.rs"

[lib]
name = "nxformat"
path = "src/lib.rs"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
nxformat-packer = { path = "../packer" }

# Built for size: conversion time goes to disk I/O, Zstandard and SHA-256, so
# only those two keep full optimization. The library is about a third smaller
# and converts at the same speed.
[profile.release]
panic = "unwind"
codegen-units = 1
lto = "fat"
opt-level = "z"

[profile.release.package.zstd-sys]
opt-level = 3

[profile.release.package.sha2]
opt-level = 3
