[package]
name = "nxformat-packer"
version = "1.0.2"
edition = "2021"
license = "MIT"
rust-version = "1.80"
description = "Source-independent NXFormat 1.0.2 archive writer"

[lib]
name = "nxformat_packer"
path = "src/lib.rs"

[features]
default = ["accelerated-sha"]
accelerated-sha = ["dep:sha2"]

[dependencies]
same-file = "=1.0.6"
sha2 = { version = "=0.10.9", optional = true }
zstd = { version = "=0.14.3", default-features = false, features = ["experimental"] }

[dev-dependencies]

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

