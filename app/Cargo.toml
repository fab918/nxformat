[package]
name = "nxconvert"
version = "1.0.1"
edition = "2021"
license = "MIT"
rust-version = "1.95"
description = "NXConvert: converts games to NX and edits NX archives (GUI and CLI)"
publish = false

[[bin]]
name = "nxconvert"
path = "src/main.rs"

[dependencies]
nxformat-packer = { path = "../packer" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = "0.17"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }

[profile.release]
codegen-units = 1
lto = "thin"

# Load the Wayland client library at run time, as X11 is: no build dependency.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30.13", default-features = false, features = ["wayland-dlopen"] }

# Windows: embed the application icon in nxconvert.exe.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
